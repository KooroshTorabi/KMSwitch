<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Shared drive: move files between the two PCs">
<title>Shared drive: move files between the two PCs</title>
<style>
text{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#0f172a}
.m{fill:#64748b;font-size:11px} .b{font-weight:600}
.loop{animation-duration:6s;animation-iteration-count:infinite}
@keyframes on1{0.00%{opacity:1} 50.00%{opacity:1} 50.01%{opacity:0} 100.00%{opacity:0}}@keyframes on2{0.00%{opacity:0} 49.99%{opacity:0} 50.00%{opacity:1} 100.00%{opacity:1}}.a1{animation-name:on1}.a2{animation-name:on2}@keyframes file{0%{transform:translate(70px,50px);opacity:0}6%{opacity:1}18%{transform:translate(70px,50px)}36%{transform:translate(150px,70px)}44%{transform:translate(150px,70px);opacity:1}48%{opacity:0}100%{opacity:0}}@keyframes file2{0%,56%{transform:translate(285px,70px);opacity:0}60%{opacity:1}78%{transform:translate(370px,48px)}94%{opacity:1}100%{transform:translate(370px,48px);opacity:0}}.f1{animation-name:file}.f2{animation-name:file2}@keyframes sw{0%,46%{opacity:0}50%{opacity:1}60%,100%{opacity:0}}.sw{animation-name:sw}
</style>
<rect x="1" y="1" width="478" height="268" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
<path d="M218,188 C218,168 125,170 125,160" fill="none" stroke="#cbd5e1" stroke-width="3"/>
<path d="M262,188 C262,168 355,170 355,160" fill="none" stroke="#cbd5e1" stroke-width="3"/>
<path class="a1 loop" d="M218,188 C218,168 125,170 125,160" fill="none" stroke="#2563eb" stroke-width="3.5"/>
<path class="a2 loop" d="M262,188 C262,168 355,170 355,160" fill="none" stroke="#ea580c" stroke-width="3.5"/>
<g>
<rect x="34" y="28" width="182" height="112" rx="8" fill="#1e293b"/>
<rect x="40" y="34" width="170" height="100" rx="3" fill="#e2e8f0"/>
<rect x="119.0" y="140" width="12" height="14" fill="#334155"/>
<rect x="95.0" y="153" width="60" height="5" rx="2.5" fill="#334155"/>
<text x="67.0" y="158" text-anchor="middle" class="b" font-size="13">PC 1</text>
<rect class="a1 loop" x="32" y="26" width="186" height="116" rx="10" fill="none" stroke="#2563eb" stroke-width="4"/>
</g>
<g>
<rect x="264" y="28" width="182" height="112" rx="8" fill="#1e293b"/>
<rect x="270" y="34" width="170" height="100" rx="3" fill="#e2e8f0"/>
<rect x="349.0" y="140" width="12" height="14" fill="#334155"/>
<rect x="325.0" y="153" width="60" height="5" rx="2.5" fill="#334155"/>
<text x="413.0" y="158" text-anchor="middle" class="b" font-size="13">PC 2</text>
<rect class="a2 loop" x="262" y="26" width="186" height="116" rx="10" fill="none" stroke="#ea580c" stroke-width="4"/>
</g>
<g class="a1 loop"><rect x="144" y="66" width="58" height="34" rx="5" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<rect x="155" y="72" width="36" height="12" rx="2" fill="#2563eb" opacity=".2"/>
<text x="173" y="95" text-anchor="middle" font-size="8" class="b" style="fill:#2563eb">KMSWITCH</text></g>
<g class="a2 loop"><rect x="278" y="66" width="58" height="34" rx="5" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
<rect x="289" y="72" width="36" height="12" rx="2" fill="#ea580c" opacity=".2"/>
<text x="307" y="95" text-anchor="middle" font-size="8" class="b" style="fill:#ea580c">KMSWITCH</text></g>
<g class="f1 loop"><path d="M0,0 h16 l7,7 v21 h-23 Z" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<path d="M16,0 v7 h7" fill="none" stroke="#2563eb" stroke-width="2"/>
<line x1="4" y1="14" x2="17" y2="14" stroke="#2563eb" stroke-width="2"/><line x1="4" y1="20" x2="14" y2="20" stroke="#2563eb" stroke-width="2"/></g>
<g class="f2 loop"><path d="M0,0 h16 l7,7 v21 h-23 Z" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
<path d="M16,0 v7 h7" fill="none" stroke="#ea580c" stroke-width="2"/>
<line x1="4" y1="14" x2="17" y2="14" stroke="#ea580c" stroke-width="2"/><line x1="4" y1="20" x2="14" y2="20" stroke="#ea580c" stroke-width="2"/></g>
<rect x="200" y="188" width="80" height="36" rx="7" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
<text x="240.0" y="210.0" text-anchor="middle" class="b" font-size="12">microSD</text>
<text class="sw loop b" x="240" y="104" text-anchor="middle" font-size="12" style="fill:#0f172a">switch</text>
<path class="sw loop" d="M222,112 h36 m-6,-5 l6,5 l-6,5" fill="none" stroke="#0f172a" stroke-width="2"/>
<text x="240.0" y="262" text-anchor="middle" class="m">Save a file on the box's drive, switch, open it on the other PC</text>

</svg>
