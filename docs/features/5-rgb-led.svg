<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="RGB LED header: light shows which PC is active">
<title>RGB LED header: light shows which PC is active</title>
<style>
text{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#0f172a}
.m{fill:#64748b;font-size:11px} .b{font-weight:600}
.loop{animation-duration:6s;animation-iteration-count:infinite}
@keyframes led{0%,45%{fill:#2563eb}50%,95%{fill:#ea580c}100%{fill:#2563eb}}.led{animation-name:led}@keyframes glow{0%,45%{fill:#2563eb;opacity:.35}50%,95%{fill:#ea580c;opacity:.35}100%{fill:#2563eb;opacity:.35}}.glow{animation-name:glow}@keyframes on1{0.00%{opacity:1} 47.00%{opacity:1} 47.01%{opacity:0} 100.00%{opacity:0}}@keyframes on2{0.00%{opacity:0} 47.00%{opacity:0} 47.01%{opacity:1} 97.00%{opacity:1} 97.01%{opacity:0} 100.00%{opacity:0}}@keyframes on1b{0.00%{opacity:0} 97.00%{opacity:0} 97.01%{opacity:1} 100.00%{opacity:1}}.a1{animation-name:on1}.a2{animation-name:on2}.a1b{animation-name:on1b}@keyframes run{0%{transform:translateX(0)}100%{transform:translateX(-20px)}}.data{animation:run .6s linear infinite}
</style>
<rect x="1" y="1" width="478" height="268" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
<defs><filter id="bl" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="8"/></filter></defs>
<rect x="35" y="35" width="120" height="76" rx="7" fill="#1e293b"/><rect x="40" y="40" width="110" height="66" rx="3" fill="#e2e8f0"/><rect x="90.0" y="111" width="10" height="10" fill="#334155"/><text x="95.0" y="138" text-anchor="middle" class="b" font-size="12">PC 1</text><rect class="a1 loop" x="33" y="33" width="124" height="80" rx="9" fill="none" stroke="#2563eb" stroke-width="4"/>
<rect class="a1b loop" x="33" y="33" width="124" height="80" rx="9" fill="none" stroke="#2563eb" stroke-width="4"/>
<rect x="325" y="35" width="120" height="76" rx="7" fill="#1e293b"/><rect x="330" y="40" width="110" height="66" rx="3" fill="#e2e8f0"/><rect x="380.0" y="111" width="10" height="10" fill="#334155"/><text x="385.0" y="138" text-anchor="middle" class="b" font-size="12">PC 2</text><rect class="a2 loop" x="323" y="33" width="124" height="80" rx="9" fill="none" stroke="#ea580c" stroke-width="4"/>
<rect class="glow loop" x="161" y="126" width="158" height="34" rx="17" fill="#2563eb" opacity=".35" filter="url(#bl)"/><rect x="175" y="60" width="130" height="70" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="2"/><text x="240.0" y="90" text-anchor="middle" class="b" font-size="13">kmswitch</text><text x="240.0" y="108" text-anchor="middle" class="m">active PC</text>
<rect x="179" y="133" width="122" height="20" rx="4" fill="#1e293b"/><rect x="187" y="136" width="14" height="14" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/><circle class="led loop" cx="194" cy="143" r="4.5" fill="#2563eb"/><rect x="208" y="136" width="14" height="14" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/><circle class="led loop" cx="215" cy="143" r="4.5" fill="#2563eb"/><rect x="229" y="136" width="14" height="14" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/><circle class="led loop" cx="236" cy="143" r="4.5" fill="#2563eb"/><rect x="250" y="136" width="14" height="14" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/><circle class="led loop" cx="257" cy="143" r="4.5" fill="#2563eb"/><rect x="271" y="136" width="14" height="14" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/><circle class="led loop" cx="278" cy="143" r="4.5" fill="#2563eb"/><rect x="292" y="136" width="14" height="14" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/><circle class="led loop" cx="299" cy="143" r="4.5" fill="#2563eb"/>
<rect x="150" y="192" width="180" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="162" y="210" class="b" font-size="11">J6 · RGB</text><text x="162" y="226" class="m">WS2812 / SK6812</text><rect x="260" y="201" width="12" height="12" fill="#facc15" stroke="#0f172a" stroke-width="1"/><text x="266" y="228" text-anchor="middle" font-size="9" class="b" style="fill:#dc2626">5V</text><rect x="282" y="201" width="12" height="12" fill="#facc15" stroke="#0f172a" stroke-width="1"/><text x="288" y="228" text-anchor="middle" font-size="9" class="b" style="fill:#16a34a">DIN</text><rect x="304" y="201" width="12" height="12" fill="#facc15" stroke="#0f172a" stroke-width="1"/><text x="310" y="228" text-anchor="middle" font-size="9" class="b" style="fill:#0f172a">GND</text><path d="M288,192 C288,162 285,170 285,154" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="4 4"/>
<text x="240.0" y="262" text-anchor="middle" class="m">Optional LED strip on header J6, lit in the colour of the active PC</text>

</svg>
