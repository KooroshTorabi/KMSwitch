<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Edge switching: the mouse moves across to the other PC">
<title>Edge switching: the mouse moves across to the other PC</title>
<style>
text{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#0f172a}
.m{fill:#64748b;font-size:11px} .b{font-weight:600}
.loop{animation-duration:6s;animation-iteration-count:infinite}
@keyframes on1{0.00%{opacity:1} 40.00%{opacity:1} 40.01%{opacity:0} 84.99%{opacity:0} 85.00%{opacity:1} 100.00%{opacity:1}}@keyframes on2{0.00%{opacity:0} 40.00%{opacity:0} 40.01%{opacity:1} 85.00%{opacity:1} 85.01%{opacity:0} 100.00%{opacity:0}}.a1{animation-name:on1}.a2{animation-name:on2}@keyframes ptr{0%{transform:translate(80px,95px)}20%{transform:translate(150px,60px)}40%{transform:translate(206px,72px)}40.01%{transform:translate(272px,72px)}60%{transform:translate(380px,105px)}72%{transform:translate(330px,60px)}85%{transform:translate(272px,80px)}85.01%{transform:translate(206px,80px)}100%{transform:translate(80px,95px)}}.ptr{animation-name:ptr;animation-timing-function:ease-in-out}@keyframes flash{0%,36%{opacity:0}40%{opacity:1}48%,80%{opacity:0}85%{opacity:1}93%,100%{opacity:0}}.edge{animation-name:flash}
</style>
